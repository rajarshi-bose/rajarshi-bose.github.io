<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap">
<style>
/* Layout: a 12-column Swiss grid. Name set huge and flush left, a three-part intro row, then a full-width project index where each row reveals itself on hover. */
:root {
  --paper: #f1efe9;
  --ink: #000000;
  --muted: #6e6a62;
  --rule: #000000;
  --faint: #d8d4ca;
  --signal: #e5361b;   /* Swiss red */
  --go: #2f9e44;       /* complete */
  --font: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ease-out: cubic-bezier(0.19, 1, 0.22, 1);      /* expo */
  --ease-roll: cubic-bezier(0.645, 0.045, 0.355, 1); /* in-out cubic */
  --gutter: clamp(12px, 1.6vw, 24px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #121110; --ink: #f1efe9; --muted: #9a958b; --rule: #f1efe9; --faint: #2f2c28; --signal: #ff5a3c; --go: #4cc764; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #121110; --ink: #f1efe9; --muted: #9a958b; --rule: #f1efe9; --faint: #2f2c28; --signal: #ff5a3c; --go: #4cc764; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }

.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1600px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); }

/* ---------- Header ---------- */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); }
header .grid { padding-block: 16px; font-size: .95rem; font-weight: 500; align-items: center; }
header .me { grid-column: 1 / 4; font-weight: 700; display: inline-flex; align-items: center; gap: 9px; justify-self: start; }
header .me svg { width: 17px; height: 20px; transition: color 150ms ease, transform 200ms var(--ease-out); }
header .me:hover svg { color: var(--signal); transform: translateY(-2px); }
header nav { grid-column: 4 / 10; display: flex; gap: 22px; }
header nav a { color: var(--muted); transition: color 150ms ease; }
header nav a:hover, header nav a[aria-current="page"] { color: var(--ink); }
header .where { grid-column: 10 / 13; text-align: right; color: var(--muted); }

/* ---------- Letter machinery ---------- */
.word { display: inline-block; white-space: nowrap; }
.ch { display: inline-block; position: relative; vertical-align: top; padding-bottom: .25em; margin-bottom: -.25em; clip-path: inset(-0.4em -0.3em 0 -0.3em); }
.ch > span { display: block; }
.ch > .roll { display: flex; flex-direction: column; gap: .3em; }
.roll > span { display: block; line-height: 1.12; }
.roll > .b { color: var(--signal); }
.ch.tw { padding-bottom: 0; margin-bottom: 0; line-height: 1.12; height: 1.12em; clip-path: inset(0 -0.3em); }

/* Hero intro: letters rise into place once, on load */
.hero h1 {
  font-weight: 800; letter-spacing: -0.055em; line-height: .84;
  font-size: clamp(4.2rem, 17.5vw, 19rem);
  margin: clamp(32px, 6vw, 80px) 0 0 -0.04em;
}
.intro .ch > .a { transform: translateY(140%); }
.intro.go .ch > .a { transform: none; transition: transform 1000ms var(--ease-out); transition-delay: calc(var(--i) * 38ms); }

.lede-row { margin-top: clamp(28px, 4vw, 56px); padding-top: 14px; border-top: 2px solid var(--rule); row-gap: 24px; }
.lede-row .k { grid-column: 1 / 4; font-weight: 600; }
.lede-row .k span { display: block; color: var(--muted); font-weight: 500; }
.lede-row p.big { grid-column: 4 / 10; margin: 0; font-size: clamp(1.15rem, 1.6vw, 1.5rem); line-height: 1.28; letter-spacing: -0.015em; font-weight: 500; text-wrap: pretty; max-width: 42ch; }
.lede-row p.small { grid-column: 10 / 13; margin: 0; color: var(--muted); font-size: .95rem; max-width: 34ch; }
.fade { opacity: 1; transform: none; }
.intro .fade { opacity: 0; transform: translateY(10px); }
.intro.go .fade { opacity: 1; transform: none; transition: opacity 700ms var(--ease-out) 700ms, transform 700ms var(--ease-out) 700ms; }

/* ---------- Project grid ---------- */
.index { margin-top: clamp(72px, 10vw, 140px); }
.index-head { padding-bottom: 10px; border-bottom: 2px solid var(--rule); font-size: .9rem; color: var(--muted); font-weight: 500; align-items: baseline; }
.index-head .lhs { grid-column: 1 / 7; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 22px; }
.index-head h2 { margin: 0; font-size: inherit; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.filter { display: inline-flex; align-items: baseline; gap: 8px; }
.dd { position: relative; }
.dd-btn {
  font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; background: transparent;
  border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; padding: 0 18px 1px 0; position: relative;
  transition: color 150ms ease, border-color 150ms ease;
}
.dd-btn::after { content: ""; position: absolute; right: 2px; top: 50%; width: 0; height: 0; border: 5px solid transparent; border-top-color: currentColor; border-bottom: 0; transform: translateY(-30%); transition: transform 200ms var(--ease-out); }
.dd-btn[aria-expanded="true"]::after { transform: translateY(-30%) rotate(180deg); }
.dd-btn:hover, .dd-btn[aria-expanded="true"] { color: var(--signal); border-color: var(--signal); }
.dd-list {
  position: absolute; left: -14px; top: calc(100% + 10px); z-index: 30; min-width: 180px;
  margin: 0; padding: 6px 0; list-style: none; background: #000; color: #f1efe9;
  font-size: .95rem; font-weight: 600; outline: none;
  animation: ddIn 180ms var(--ease-out);
}
@keyframes ddIn { from { opacity: 0; transform: translateY(-4px); } }
.dd-list li { padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.dd-list li::before { content: ""; width: 7px; height: 7px; flex: none; }
.dd-list li[aria-selected="true"]::before { background: currentColor; }
.dd-list li.active, .dd-list li:hover { background: var(--signal); color: #000; }
.index-head .key { grid-column: 7 / 13; text-align: right; display: flex; justify-content: flex-end; gap: 18px; }
.key span { display: inline-flex; align-items: center; gap: 7px; }
.dot { width: .55em; height: .55em; border-radius: 50%; background: var(--go); display: inline-block; flex: none; }
.dot.live { background: var(--signal); animation: blink 1.4s steps(1, end) infinite; }
@keyframes blink { 50% { opacity: .15; } }

.tiles { margin-top: 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: var(--gutter); row-gap: clamp(36px, 4vw, 56px); }
.tile { display: block; min-width: 0; }
.tile-in { display: flex; flex-direction: column; gap: 12px; }
.tile.sliding { clip-path: inset(0); }
.tile.sliding .tile-in { will-change: transform; }
.tile .art { position: relative; aspect-ratio: 1; max-width: 100%; overflow: hidden; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.tile .art > svg { width: 68%; height: 68%; }
.tile .art > img { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); max-width: none; object-fit: cover; image-rendering: pixelated; display: block; }
.tile .art:has(> img), .p-art:has(img) { background: #000; }
.tile .art > svg, .tile .art > img { transition: transform 420ms ease; }
.tile .reveal {
  position: absolute; inset: 0; color: #000;
  background: color-mix(in srgb, var(--signal) 88%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: flex; flex-direction: column; gap: 10px; padding: clamp(12px, 1.3vw, 18px);
  opacity: 0;
}
.tile .reveal p {
  flex: 1; min-height: 0; overflow: hidden; margin: 0;
  font-size: clamp(1.3rem, 1.9vw, 1.85rem); line-height: 1.08; font-weight: 600; letter-spacing: -0.025em;
  -webkit-mask-image: linear-gradient(#000 55%, transparent 96%); mask-image: linear-gradient(#000 55%, transparent 96%);
  transform: translateY(6px); filter: blur(4px);
}
.tile .reveal span { font-size: .95rem; font-weight: 700; opacity: 0; }
.tile .cap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; column-gap: 10px; row-gap: 4px; }
.tile .yr { font-size: .86rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .st { font-size: .86rem; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.tile .name { flex-basis: 100%; font-size: clamp(1.25rem, 1.75vw, 1.7rem); font-weight: 700; letter-spacing: -0.035em; line-height: 1; text-wrap: balance; }
.tile .field { flex-basis: 100%; font-size: .95rem; color: var(--muted); }
.tile .sum { display: none; margin: 0; font-size: .95rem; color: var(--muted); }

@media (hover: hover) and (pointer: fine) {
  .tile .reveal { transition: opacity 380ms ease; }
  .tile .reveal p { transition: transform 480ms var(--ease-out) 60ms, filter 480ms var(--ease-out) 60ms; }
  .tile .reveal span { transition: opacity 300ms ease 220ms; }
  .tile:hover .reveal, .tile:focus-visible .reveal { opacity: 1; }
  .tile:hover .reveal p, .tile:focus-visible .reveal p { transform: none; filter: none; }
  .tile:hover .reveal span, .tile:focus-visible .reveal span { opacity: 1; }
  .tile:hover .art > svg, .tile:hover .art > img, .tile:focus-visible .art > svg, .tile:focus-visible .art > img { transform: scale(1.04); }
  .tile .name .roll { transition: transform 420ms var(--ease-roll); transition-delay: calc(var(--i) * 14ms); }
  .tile:hover .name .roll, .tile:focus-visible .name .roll { transform: translateY(-1.42em); }
  .tile .field { transition: color 150ms ease; }
  .tile:hover .field { color: var(--signal); }
  .tile:focus-visible { outline: none; }
  .tile:focus-visible .art { outline: 2px solid var(--signal); outline-offset: 4px; }
}
@media (hover: none), (pointer: coarse) {
  .tile .sum { display: block; }
  .tile .reveal { display: none; }
}

/* ---------- Inner pages ---------- */
.inner { padding-top: clamp(32px, 6vw, 80px); }
.inner h1 { font-weight: 800; letter-spacing: -0.05em; line-height: .9; font-size: clamp(3rem, 9vw, 9rem); margin: 0 0 0 -0.03em; text-wrap: balance; }
.back { display: inline-flex; align-items: center; gap: .45em; color: var(--muted); font-weight: 500; margin-bottom: 28px; transition: color 150ms ease; }
.back .arr { display: inline-block; transition: transform 200ms var(--ease-out); }
.back:hover .arr { transform: translateX(-4px); }
.back:hover { color: var(--signal); }
.facts { margin-top: 40px; border-top: 2px solid var(--rule); padding-top: 14px; row-gap: 20px; }
.facts div { grid-column: span 3; min-width: 0; }
.facts dt { color: var(--muted); font-size: .9rem; }
.facts dd { margin: 2px 0 0; font-weight: 600; }
.body-text { margin-top: 56px; row-gap: 28px; }
.body-text h3 { grid-column: 1 / 4; margin: 0; font-size: 1rem; font-weight: 700; }
.body-text p { grid-column: 4 / 10; margin: 0; font-size: 1.2rem; line-height: 1.5; max-width: 60ch; }
.body-text p.draft { color: var(--muted); }
.kw { grid-column: 4 / 10; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; max-height: 68px; overflow: hidden; }
.kw-item { flex: none; white-space: nowrap; border: 1px solid var(--rule); padding: 4px 10px; font-size: .92rem; font-weight: 500; line-height: 20px; }
/* Past two lines: the second line keeps going in one row and fades out at the right edge */
.kw.split { flex-direction: column; flex-wrap: nowrap; max-height: none; }
.kw-row { display: flex; gap: 8px; min-width: 0; }
.kw-row.tail { overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, #000 62%, transparent 98%); mask-image: linear-gradient(to right, #000 62%, transparent 98%); }
.related { margin-top: clamp(64px, 9vw, 120px); }
.related .key { color: var(--muted); }
.tile .shared { color: var(--muted); }
.p-head { display: grid; grid-template-columns: minmax(0, 1fr) auto clamp(130px, 14vw, 190px); column-gap: clamp(16px, 2vw, 24px); align-items: start; }
.p-head > div:first-child { padding-right: clamp(4px, 2vw, 32px); }
.p-meta { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 22px 0 0; font-size: 1.05rem; color: var(--muted); }
.p-meta b { color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-left: 6px; }
.p-side { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; min-width: 0; }
.p-meta { align-items: center; }
.p-actions { display: flex; flex-direction: column; gap: 8px; min-width: 176px; }
.act-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 13px;
  font: 700 .95rem/1.2 var(--font); letter-spacing: -.01em; text-align: left; cursor: pointer;
  color: var(--ink); background: transparent; border: 1px solid var(--ink);
  transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
}
.p-actions .act-btn:first-child { background: var(--ink); color: var(--paper); }
.act-btn .ar { width: 12px; height: 12px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: square; transition: transform 200ms var(--ease-out); }
.act-btn:not(.off):hover, .act-btn:not(.off):focus-visible { background: var(--signal); border-color: var(--signal); color: #000; }
.act-btn:not(.off):hover .ne, .act-btn:not(.off):focus-visible .ne { transform: translate(2px, -2px); }
.act-btn:not(.off):hover .dn, .act-btn:not(.off):focus-visible .dn { transform: translateY(2px); }
.act-btn:not(.off):active { transform: scale(.97); }
.act-btn.off, .p-actions .act-btn.off:first-child { cursor: not-allowed; color: var(--muted); background: transparent; border-color: var(--faint); }
@media (prefers-reduced-motion: reduce) { .act-btn, .act-btn .ar { transition: none; } }
.p-art { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; overflow: hidden; background: var(--ink); color: var(--paper); display: block; }
button.p-art { border: 0; padding: 0; margin: 0; font: inherit; cursor: pointer; }
.p-art .pa-img { position: absolute; inset: 0; display: grid; place-items: center; }
.p-art .pa-img svg { width: 66%; height: 66%; }
.p-art .pa-img { inset: -1px; }
.p-art .pa-img img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; }
.tile .art > img.smooth, .p-art .pa-img img.smooth { image-rendering: auto; }
.p-art .pa-veil { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; background: color-mix(in srgb, var(--signal) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #000; }
.p-art .pa-go { font-size: clamp(1.4rem, 2.4vw, 2rem); font-weight: 800; letter-spacing: -0.03em; display: inline-flex; gap: .25em; filter: blur(4px); transform: translateY(6px); }
.p-art .pa-go .ne { display: inline-block; }
.p-art .pa-hint { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 7px 8px; background: var(--paper); color: var(--ink); text-align: center; font-size: .82rem; font-weight: 600; animation: hint 1.1s steps(1, end) infinite; }
@keyframes hint { 50% { opacity: 0; } }
.p-art .pa-hint { display: flex; align-items: center; justify-content: center; gap: .35em; }
.p-art .pa-hint .tri { font-size: 1.6em; line-height: .6; }
.p-art .pa-hint { white-space: nowrap; }
@media (hover: hover) and (pointer: fine) {
  .p-art .pa-img { transition: transform 420ms ease; }
  .p-art .pa-veil { transition: opacity 380ms ease; }
  .p-art .pa-go { transition: filter 480ms var(--ease-out) 60ms, transform 480ms var(--ease-out) 60ms; }
  .p-art .pa-go .ne { transition: transform 260ms var(--ease-out) 200ms; }
  .p-art .pa-hint { transition: opacity 150ms ease; }
  .p-art.act:hover .pa-img, .p-art.act:focus-visible .pa-img { transform: scale(1.05); }
  .p-art.act:hover .pa-veil, .p-art.act:focus-visible .pa-veil { opacity: 1; }
  .p-art.act:hover .pa-go, .p-art.act:focus-visible .pa-go { filter: none; transform: none; }
  .p-art.act:hover .pa-go .ne, .p-art.act:focus-visible .pa-go .ne { transform: translate(3px, -3px); }
  .p-art.act:hover .pa-hint, .p-art.act:focus-visible .pa-hint { animation: none; opacity: 0; }
}
.p-art.act:active { transform: scale(.98); }
.slots { margin-top: 48px; row-gap: var(--gutter); }
.slot { grid-column: span 4; aspect-ratio: 4 / 5; max-width: 100%; border: 1px solid var(--faint); display: grid; place-items: end start; padding: 12px; color: var(--muted); font-size: .9rem; }

/* ---------- Gallery window ---------- */
.gal { padding: 0; border: 0; margin: auto; background: transparent; color: var(--ink); overflow: visible;
  width: min(1180px, calc(100vw - 32px)); height: min(760px, calc(100dvh - 32px)); max-width: none; max-height: none; }
.gal::backdrop { background: rgba(0, 0, 0, .74); }
.gal[open] .gal-win { animation: galIn 280ms var(--ease-out); }
@keyframes galIn { from { opacity: 0; transform: translateY(12px) scale(.985); } }
.gal-win { width: 100%; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 330px; background: var(--paper); border: 2px solid var(--rule); }
.gal-stage { position: relative; min-width: 0; min-height: 0; background: #000; overflow: hidden; }
.gal-media { position: absolute; inset: 0; display: grid; place-items: center; padding: clamp(12px, 2.4vw, 32px) clamp(56px, 5vw, 72px); }
.gal-media img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; image-rendering: pixelated; animation: galImg 260ms ease; }
.gal-media img.smooth { image-rendering: auto; }
@keyframes galImg { from { opacity: 0; } }
.gal-ph { width: min(86%, 560px); aspect-ratio: 4 / 3; max-height: 100%; border: 1px dashed #77726a; display: grid; place-items: center; color: #9a958b; font-weight: 600; animation: galImg 260ms ease; }
.gal-nav { position: absolute; top: 50%; translate: 0 -50%; width: 44px; height: 44px; border: 0; background: #f1efe9; color: #000; font: 700 1.2rem var(--font); cursor: pointer; transition: background-color 150ms ease; }
.gal-nav:hover { background: var(--signal); }
.gal-nav:active { scale: .96; }
.gal-nav.prev { left: 12px; } .gal-nav.next { right: 12px; }
.gal-count { position: absolute; left: 12px; bottom: 12px; padding: 4px 8px; background: rgba(0, 0, 0, .6); color: #f1efe9; font-size: .9rem; font-variant-numeric: tabular-nums; }
.gal-side { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-left: 2px solid var(--rule); }
.gal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--rule); }
.gal-top h2 { margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
.gal-close { flex: none; font: 600 .95rem var(--font); color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; transition: color 150ms ease; }
.gal-close:hover { color: var(--signal); }
.gal-cap { margin: 0; padding: 16px 18px 18px; min-height: 5.4em; font-size: 1.15rem; line-height: 1.32; font-weight: 500; letter-spacing: -.01em; border-bottom: 1px solid var(--faint); text-wrap: pretty; }
.gal-cap .soon { display: block; margin-top: 8px; font-size: .85rem; color: var(--muted); }
.gal-list { list-style: none; margin: 0; padding: 6px 0 10px; overflow-y: auto; flex: 1; }
.gal-list button { display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 6px; width: 100%; text-align: left; padding: 9px 18px; border: 0; background: none; color: var(--muted); font: 500 .92rem/1.35 var(--font); cursor: pointer; transition: color 150ms ease; }
.gal-list button:hover { color: var(--ink); }
.gal-list button[aria-current="true"] { color: var(--ink); font-weight: 700; }
.gal-list button[aria-current="true"] .num { color: var(--signal); }
.gal-list .num { font-variant-numeric: tabular-nums; }
.gal-list .tc { font-weight: 500; font-size: .8rem; color: var(--muted); }
@media (max-width: 760px) {
  .gal { width: 100vw; height: 100dvh; }
  .gal-win { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 52%) minmax(0, 1fr); border: 0; }
  .gal-side { border-left: 0; border-top: 2px solid var(--rule); }
  .gal-top { padding-top: 14px; }
  .gal-media { padding: 12px 52px; }
  .gal-nav { width: 38px; height: 38px; }
  .gal-nav.prev { left: max(8px, env(safe-area-inset-left, 0px)); } .gal-nav.next { right: max(8px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .gal[open] .gal-win, .gal-media img, .gal-ph { animation: none; }
}

/* ---------- Footer ---------- */
footer { margin-top: clamp(80px, 12vw, 160px); }

// Split text into words of masked letters. Each letter has a red twin underneath for the hover roll.
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function letters(text, twin) {
  let i = 0;
  return text.split(" ").map(w => `<span class="word">${[...w].map(c =>
    twin
      ? `<span class="ch tw"><span class="roll" style="--i:${i++}"><span>${esc(c)}</span><span class="b">${esc(c)}</span></span></span>`
      : `<span class="ch" style="--i:${i++}"><span class="a">${esc(c)}</span></span>`
  ).join("")}</span>`).join(" ");
}

// Related projects: ranked by how many keywords they share with this one
const norm = (t) => t.toLowerCase();
function related(p) {
  const mine = new Set(p.tags.map(norm));
  return projects
    .filter(q => q !== p)
    .map((q, i) => ({ q, i, shared: q.tags.filter(t => mine.has(norm(t))) }))
    .filter(r => r.shared.length)
    .sort((a, b) => b.shared.length - a.shared.length || (b.q.field === p.field) - (a.q.field === p.field) || a.i - b.i)
    .slice(0, 5);
}
function relatedHTML(p) {
  const r = related(p);
  if (!r.length) return "";
  return `
    <section class="related" aria-labelledby="rel">
      <div class="index-head grid"><div class="lhs"><h2 id="rel">Related projects</h2></div><span class="key">Most related first, by shared keywords</span></div>
      <div class="tiles">${r.map(x => tileHTML(x.q, { shared: x.shared })).join("")}</div>
    </section>`;
}

// ---------- Project type filter ----------
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let filterRun = 0;
function applyFilter(t) {
  currentType = t;
  const grid = document.getElementById("homeTiles"); if (!grid) return;
  const tiles = [...grid.querySelectorAll(".tile")];
  const match = (el) => !t || el.dataset.type === t;
  const inner = (el) => el.querySelector(".tile-in");
  const setCount = () => { document.getElementById("pcount").textContent = tiles.filter(match).length; };
  tiles.forEach(el => { inner(el).getAnimations().forEach(an => an.cancel()); el.classList.remove("sliding"); });
  if (reduceMotion) { tiles.forEach(el => { el.hidden = !match(el); }); setCount(); return; }
  const run = ++filterRun;
  const roll = "cubic-bezier(0.645, 0.045, 0.355, 1)", settle = "cubic-bezier(0.19, 1, 0.22, 1)";
  // 1. every visible tile slides up and out of its slot, left to right
  const outs = tiles.filter(el => !el.hidden).map((el, i) => {
    el.classList.add("sliding");
    return inner(el).animate([{ transform: "translateY(0)" }, { transform: "translateY(-102%)" }],
      { duration: 380, easing: roll, delay: i * 30, fill: "forwards" }).finished.catch(() => {});
  });
  Promise.all(outs).then(() => {
    if (run !== filterRun) return;
    // 2. swap in the filtered set, then slide each tile up into place
    setCount();
    tiles.forEach(el => { el.hidden = !match(el); inner(el).getAnimations().forEach(an => an.cancel()); el.classList.remove("sliding"); });
    tiles.filter(match).forEach((el, i) => {
      el.classList.add("sliding");
      const an = inner(el).animate([{ transform: "translateY(102%)" }, { transform: "translateY(0)" }],
        { duration: 640, easing: settle, delay: 80 + i * 150, fill: "backwards" });
      an.finished.then(() => el.classList.remove("sliding")).catch(() => {});
    });
  });
}

// ---------- Dropdown (listbox) ----------
function ddParts() { return { btn: document.getElementById("typeBtn"), list: document.getElementById("typeList") }; }
function ddOpen() {
  const { btn, list } = ddParts(); if (!list) return;
  list.hidden = false; btn.setAttribute("aria-expanded", "true");
  const sel = list.querySelector('[aria-selected="true"]') || list.firstElementChild;
  ddActivate(sel); list.focus();
}
function ddClose(focusBtn) {
  const { btn, list } = ddParts(); if (!list || list.hidden) return;
  list.hidden = true; btn.setAttribute("aria-expanded", "false");
  if (focusBtn) btn.focus();
}
function ddActivate(li) {
  const { list } = ddParts();
  list.querySelectorAll("li").forEach(x => x.classList.toggle("active", x === li));
  list.setAttribute("aria-activedescendant", li.id);
}
function ddChoose(li) {
  const { list } = ddParts();
  list.querySelectorAll("li").forEach(x => x.setAttribute("aria-selected", String(x === li)));
  document.getElementById("typeVal").textContent = li.textContent;
  ddClose(true);
  if (li.dataset.value !== currentType) applyFilter(li.dataset.value);
}
app.addEventListener("click", (e) => {
  if (e.target.closest("#typeBtn")) { const { list } = ddParts(); list.hidden ? ddOpen() : ddClose(true); return; }
  const li = e.target.closest("#typeList li"); if (li) ddChoose(li);
});
app.addEventListener("mousemove", (e) => { const li = e.target.closest("#typeList li"); if (li) ddActivate(li); });
app.addEventListener("keydown", (e) => {
  if (e.target.id === "typeBtn" && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); ddOpen(); return; }
  if (e.target.id !== "typeList") return;
  const items = [...e.target.querySelectorAll("li")];
  const i = items.findIndex(x => x.classList.contains("active"));
  const go = (n) => { e.preventDefault(); ddActivate(items[(n + items.length) % items.length]); };
  if (e.key === "ArrowDown") go(i + 1);
  else if (e.key === "ArrowUp") go(i - 1);
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(items.length - 1);
  else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ddChoose(items[i]); }
  else if (e.key === "Escape") { e.preventDefault(); ddClose(true); }
  else if (e.key === "Tab") ddClose(false);
});
document.addEventListener("click", (e) => { if (!e.target.closest(".dd")) ddClose(false); });

const routes = { about: aboutView, art: artView };
function show(route) {
  const p = projects.find(x => x.id === route);
  if (routes[route]) app.innerHTML = routes[route]();
  else if (p) app.innerHTML = projectView(p);
  else { route = ""; app.innerHTML = homeView(); }
  document.querySelectorAll("header nav a").forEach(a => a.dataset.route === route ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
  // Play the letter intro once per view
  const intro = document.getElementById("intro");
  if (intro) { intro.classList.add("intro"); intro.getBoundingClientRect(); requestAnimationFrame(() => intro.classList.add("go")); }
  clipKeywords();
}
// When keywords run past two lines, keep line one as is and put the rest in one row that fades out
function clipKeywords() {
  const k = document.querySelector(".kw"); if (!k) return;
  const items = [...k.querySelectorAll(".kw-item")];
  k.classList.remove("split"); k.replaceChildren(...items);
  if (k.scrollHeight <= k.clientHeight + 1) return;
  const top = items[0].offsetTop;
  const first = items.filter(el => el.offsetTop === top);
  const row = (cls, els) => { const r = document.createElement("div"); r.className = "kw-row " + cls; r.setAttribute("role", "none"); r.append(...els); return r; };
  k.replaceChildren(row("first", first), row("tail", items.slice(first.length)));
  k.classList.add("split");
}
addEventListener("resize", clipKeywords);
document.fonts && document.fonts.ready.then(clipKeywords);
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-route]");
  if (!a) return;
  e.preventDefault();
  show(a.dataset.route);
});
